# 配置索引：
#   [params]           站点参数总入口
#   params.post        文章正文字号
#   params.links       友链页
#   params.moments     动态页
#   params.bangumi     追番页（Bilibili）
#   params.loader      全站加载动画
#   params.author      作者信息
#   params.hero        首页 Hero
#   params.footer      页脚
#   params.home        首页布局
#   params.notice      公告栏
#   params.social      社交图标
#   params.charts      归档/标签图表
#   params.sponsor     赞助
#   params.license     版权声明
#   params.comment     评论 provider
#   params.waline      Waline（备用）
#   params.twikoo      Twikoo（当前）
#   params.envelope    留言页信封
#   params.navbar      顶栏
#   params.search      全文搜索
#   params.menu.main   导航菜单
#   params.music       音乐播放器
#   params.live2d      Live2D 看板娘
#   params.mouse        团团猫动态鼠标指针
#   params.effects      全站背景特效（樱花/雨/雪等）
#   params.pjax        无刷新跳转
#   params.safego      外链安全中转
# =============================================================================

# 站点正式访问地址（影响 sitemap、RSS、分享链接等绝对 URL，部署前务必与真实域名一致）
baseURL = 'https://blog.kemiaosw.top/'  # 站点根 URL
locale = 'zh-cn'                            # 站点区域/语言标识（影响 HTML lang 属性、日期格式等）
defaultContentLanguage = 'zh'               # 默认内容语言（多语言站点时的主语言）
title = '喵洛阁'          # 站点名称（浏览器标题、页脚版权等）
theme = 'aiovtue'           # 主题目录：themes/aiovtue/
hasCJKLanguage = true      # 启用中文分词（搜索、摘要等）
enableRobotsTXT = true     # 生成 robots.txt（模板在 themes/aiovtue/layouts/robots.txt）

# --- 站点地图（sitemap.xml）---
[sitemap]
  changefreq = 'weekly'    # 更新频率提示
  priority = 0.5           # 站点地图中页面的默认优先级（0~1，越大越重要）
  filename = 'sitemap.xml' # 生成的站点地图文件名

# --- 分页（首页文章列表）---
[pagination]
  pagerSize = 10           # 每页文章数

# --- 分类与标签 URL 路径 ---
[taxonomies]
  category = 'categories'  # /categories/xxx/
  tag = 'tags'             # /tags/xxx/

# --- 输出格式（首页与文章栏目额外生成 RSS）---
[outputs]
  home = ['HTML', 'RSS']       # 首页输出 HTML 与 RSS
  section = ['HTML', 'RSS']    # 栏目页（如 posts/、categories/）输出 HTML 与 RSS

# --- Markdown 渲染 ---
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true        # 允许正文内嵌 HTML
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true      # 保留 LaTeX 分隔符，由 passthrough render hook + KaTeX 构建时渲染
        # 块级公式 $$ 结束后若紧跟 --- 分隔线，中间必须空一行，否则 Goldmark 会误解析为标题
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]   # 块级 LaTeX 公式分隔符
          inline = [['\(', '\)'], ['$', '$']]   # 行内 LaTeX 公式分隔符
  [markup.highlight]
    style = "github"       # 代码高亮主题
    noClasses = false      # 是否不使用 CSS 类名而直接输出内联样式（false = 使用类名，便于自定义主题）
    lineNos = false        # 是否显示代码行号
    tabWidth = 4           # 代码中 Tab 字符渲染为空格的宽度
  [markup.tableOfContents]
    startLevel = 2         # 目录从 h2 开始
    endLevel = 4           # 目录至 h4，不显示 h5/h6
    ordered = false        # 目录使用无序列表（false）或有序列表（true）

# --- 资源类型：将 .excalidraw 识别为 JSON page bundle 资源 ---
[mediaTypes]
  [mediaTypes."application/json"]
    suffixes = ["json", "excalidraw"]  # 将该媒体类型的后缀扩展到 excalidraw，使其可作为 page bundle 资源

# =============================================================================
# 站点参数（主题通过 .Site.Params 读取）
# =============================================================================
[params]
  subtitle = '<K.M/>'                              # 副标题（首页标题后缀）
  description = '克喵的小站'                  # 站点默认描述（SEO、分享卡片）
  primaryColor = '#E5A84B'                     # 主题主色
  favicon = '/favicon.ico'                 # 站点图标路径（浏览器标签页、收藏夹）
  defaultCover = 'https://jsd.268682.xyz/gh/Kemeow0815/img@main/img/bg.webp'               # 文章默认头图（无 cover 时使用）
  math = false                                 # 默认关闭；单篇 front matter 写 math: true 启用构建时 KaTeX 渲染
  postIndent = true                            # 文章/关于页正文首行缩进 2em（单篇可写 indent: false 关闭）

  # --- 文章/关于页正文 ---
  [params.post]
    fontSize = "1.1rem"                          # 正文字号（rem，如 0.95rem / 1.1rem）

  # --- 友链页 ---
  [params.links]
    layout = 'preview'                        # preview：卡片截图 | simple：长条头像+悬停预览
    source = 'remote'                         # local：data/links.yaml | remote：浏览器实时读取 remoteURL
    remoteURL = 'https://cdn.jsdmirror.com/gh/kmoretti/hexo-blog-source@main/source/_data/links.yml' # 远程友链数据源（支持 JSON / YAML）
    offlineURL = 'https://cdn.jsdmirror.com/gh/kmoretti/butterfly-link-check@main/link-false.yml' # 失联友链数据源（浏览器实时读取）
    applicationAPI = 'https://verify.081531.xyz' # friendlink-verify 友链申请与审核状态 API
    rssEnable = true                          # 友链页「朋友动态」RSS 展示（关闭时不拉取 RSS）
    footerEnable = false                      # 全站页脚友链列表展示

  # --- 动态页（每条动态：content/moments/*.md，front matter 至少需要 date）---
  [params.moments]
    layout = "ech0"                           # ech0：Ech0 风格卡片 | memos：头像时间线 | cards：居中卡片
    cardMaxWidth = "720px"                    # cards/ech0 模式下列表最大宽度
    source = "both"                           # local：仅本地 | remote：仅远程 | both：混合
    provider = "ech0"                         # ech0：Ech0 API | blog_api：兼容旧远程 moments API
    remoteURL = "https://m.081531.xyz"        # Ech0 站点根地址；blog_api provider 使用完整 API 地址
    remoteEndpoint = "/api/echo/query"        # Ech0 查询 endpoint（浏览器端 POST）
    remoteMaxItems = 40                        # 远程首批最多纳入的动态数
    batchSize = 5                              # 动态列表每批插入 DOM 的数量
    cacheMinutes = 30                          # Ech0 远程数据 localStorage 缓存时长
    mediaOrigins = ["https://m.081531.xyz", "https://mifun.081531.xyz"] # 允许的远程媒体来源
    metingAPI = "https://meting.081531.xyz/api" # Ech0 MUSIC 扩展使用的 Meting API
    enableTwitterWidgets = true               # Tweet 扩展优先尝试官方 widgets.js，失败则静态降级
    enableRemoteReactions = true               # blog_api provider 的旧 reactions
    enableRemoteReactionVerification = true    # blog_api provider 的 AntiBot/Fingerprint/Turnstile
    enableRemoteLikes = true                   # Ech0 provider 的单向点赞
    enableRemoteComments = true                # Ech0 公开评论只读；blog_api 兼容旧入口
    showSourceBadge = true                     # 是否显示“本地/Ech0”来源标签
    showRemoteTags = true                      # 是否显示远程 tags
    showRemoteMessageLink = true               # 是否显示远程原消息链接
    showRemoteAdBadge = true                   # 兼容旧 API 的推广标识；Ech0 不提供广告字段
    telegramEnabled = true                     # 是否加载 Telegram 频道说说
    telegramURL = "https://tg-channel.081531.xyz/api/posts" # Telegram 频道 API（浏览器端 GET）
    telegramMaxItems = 40                      # Telegram 首批最多纳入的动态数
    telegramPageSize = 20                      # Telegram API 每页读取数量
    telegramCacheMinutes = 30                  # Telegram 只读数据 localStorage 缓存时长

  # --- 追番页（Bilibili 追番列表，构建时拉取 data/bangumi.json）---
  [params.bangumi]
    enable = true                             # 是否启用追番页与构建时数据拉取
    vmid = '396923563'                        # Bilibili 用户 UID（追番列表需空间公开）
    quote = '生命不息，追番不止！'              # 页面引言

  # --- Excalidraw 画板文章（content/excalidraw/<slug>/index.md + *.excalidraw）---
  # 独立栏目，首页/归档/搜索与 posts 合并展示；单页为交互式只读查看器

  # --- 全站加载动画（首页进入时的樱花加载页）---
  [params.loader]
