  # --- 首页 Hero 大图 / 视频轮播 ---
  # 媒体文件放在 static/hero/，此处写 URL 路径（以 / 开头）
  
  
  
  [params.hero]
    title = '喵洛阁'      # Hero 大标题
    motto = '每一段旅行，都有终点。'  # Hero 副标题/格言
    randomUrls = true      # 随机切换背景
    enableHitokoto = true  # 一言 API 随机格言
    typewriter = true      # 打字机效果
    typewriterSpeed = 80   # 打字机速度（毫秒/字符）
    style = 'dot'          # 背景样式：dot / grid 等
    fixedImg = true        # 背景图是否固定不随滚动移动
    playerUrl = ''  # 默认视频播放器占位/预览视频路径
    urls = [
      'https://jsd.268682.xyz/gh/Kemeow0815/img@main/img/bg.webp',
    ]

    # grid 全站背景网格（仅 params.hero.style = 'grid' 时生效）
    # size：单元格边长（px）；lineOpacity / lineOpacityDark：线条透明度 0~1，越大越深
    [params.hero.grid]
      size = 20                 # 网格单元格边长（像素）
      lineOpacity = 0.1         # 浅色模式下网格线透明度
      lineOpacityDark = 0.1     # 深色模式下网格线透明度

  # --- 页脚 ---
  [params.footer]
    since = 2024           # 版权起始年
    runtimeSince = '2024-11-01'   # 站点运行倒计时起点（YYYY-MM-DD）
    icp = ''
    # icp = '<a href="https://icp.gov.moe/?keyword=20260258" target="_blank" rel="noopener">萌ICP备20260258号</a>'  # 备案信息 HTML（可留空）

# --- 首页公告栏（右侧域名列表）---
  # --- 首页文章列表布局 ---
  # cards：默认卡片列表（含公告栏与随机文章轮播）
  # list：紧凑列表（电脑端单列时左栏站点信息/公告/标签 + 右栏文章；双列时无侧栏；不显示顶部公告栏）
  # timeline：居中时间线，文章左右交替；不显示公告栏与随机文章
  # layout：关闭随机时使用的固定布局；layouts 未设置时的后备
  # layouts：首页布局候选池（cards / list / timeline）（不建议使用）
  # layoutRandom：是否启用随机（仅电脑端；移动端固定使用 layout） （不建议使用）
  # layouts 含 2 项及以上：电脑端在布局变体间随机
  # layouts 仅含 list 时：电脑端在 list 单列/双列间随机
  # layoutRandom = false 时：固定使用 layout 与 desktopListColumns
  # mobileCardsLayout：cards / list 模式下手机端文章列表样式（仅 max-width: 768px 生效）
  # stack — 竖向卡片（cards 模式默认；list 模式下可显式设为 stack 以覆盖默认 list）
  # list  — 列表样式：隐藏公告栏与随机文章
  # single — 单列（默认）
  # double — 双列
  
  
  [params.home]
    layout = 'list'   # （cards，list，timeline）建议不要使用时间线模式，即timeline，不成熟样式
    desktopListColumns = 'single' # （single，double）list模式下单双列样式切换在此配置
    desktopListItemStyle = 'cards' # layout=list时，single模式下选择文章列表为list/cards样式
    mobileCardsLayout = 'list'     #移动端样式设置（list、stack）注意桌面端cards和list模式下移动端布局略有区别，具体自行切换查看和体验
    mobileCardsBatchSize = 10  # 每页文章数，这个和上一个配置都是桌面移动端通用的，只是名字没改而已
    # timelineBatchSize = 10   # 时间线模式：首屏条数及每次滚动加载条数
    
    # 下列配置在list模式下生效，不建议更改
    archiveHeatmapColumns = 13  # 右侧归档热力图：每行列数
    archiveHeatmapRows = 4      # 右侧归档热力图：行数（格子总数 = 列数 × 行数）
    randomSidebarCount = 7      # 右侧随机文章显示篇数，不建议过多
    
    # 下方配置不建议动，过大会影响网页性能
    featuredCount = 4           # list 模式推荐区同时可见卡片数
    featuredPoolCount = 12      # list 模式推荐区候选池（排序后取前 N 篇 SSR，供切换按钮轮换）
    mobileNoticeTicker = true   # 移动端单行滚动公告
    featuredDesktop = true      # 电脑端推荐文章区
    featuredMobile = true       # 移动端推荐文章区

    # --- 首页说说摘要条（数据源复用 params.moments）---
    [params.home.momentsTicker]
      enable = true             # 是否在 Hero 下方显示说说摘要条
      maxItems = 5              # 首页最多轮换的动态条数
      remoteMaxItems = 20       # both 模式最多请求的远程动态数
      interval = 5000           # 自动切换间隔（毫秒）
      autoPlay = true           # 是否默认自动切换
      showSourceBadge = true    # 始终显示本地/远程来源
      showResourceIcons = true  # 显示图片、定位、GitHub 等扩展提示
      showTags = true           # 显示最多一个标签
      showTime = true           # 显示相对时间
      showAds = true            # 是否显示远程推广动态
      showAdBadge = true        # 是否显示“推广”标识

  [params.notice]
    title = '公告栏'        # 公告栏标题
    rotateInterval = 5000  # 左侧随机文章轮播间隔（毫秒）
    [[params.notice.sections]]
      label = '--- 这是公告 ---'      # 公告分组标题
      lines = ['欢迎来到我的博客！']  # 该分组下的公告内容行

  # --- 侧栏 / Hero 社交图标（icon 为 Iconify 图标名）---
  [[params.social]]
    name = 'RSS'           # 社交项显示名称
    link = '/index.xml'    # Hugo 默认 RSS 路径
    icon = 'ri:rss-line'   # Iconify 图标名
    color = 'orange'       # 图标颜色
  [[params.social]]
    name = 'GitHub'        # 社交项显示名称
    link = 'https://s.081531.xyz/github'  # 链接地址
    icon = 'ri:github-line'              # Iconify 图标名
    color = '#6e5494'                    # 图标颜色
  # [[params.social]]
  #   name = '微信公众号'    # 社交项显示名称
  #   link = '/hero/wxgzh.png'             # 二维码或链接图片路径
  #   icon = 'ri:wechat-2-line'            # Iconify 图标名
  #   color = '#1AAD19'                    # 图标颜色
  [[params.social]]
    name = 'E-Mail'        # 社交项显示名称
    link = 'mailto:mcy@kemiaosw.top'            # 邮箱链接
    icon = 'ri:mail-line'                # Iconify 图标名
    color = '#8E71C1'                    # 图标颜色
  [[params.social]]
    name = 'Telegram'        # 社交项显示名称
    link = 'https://s.081531.xyz/telegram'            # 邮箱链接
    icon = 'ri:telegram-line'                # Iconify 图标名
    color = '#02E0F7'                    # 图标颜色
  [[params.social]]
    name = 'QQ'        # 社交项显示名称
    link = 'https://s.081531.xyz/qq'            # 邮箱链接
    icon = 'ri:qq-line'                # Iconify 图标名
    color = '#028DF7'                    # 图标颜色
  [[params.social]]
    name = 'BiliBili'        # 社交项显示名称
    link = 'https://s.081531.xyz/bilibili'            # 邮箱链接
    icon = 'ri:bilibili-fill'                # Iconify 图标名
    color = '#02F727'                    # 图标颜色
  [[params.social]]
    name = 'Travelling'    # 社交项显示名称
    link = 'https://www.travellings.cn/go.html'  # 链接地址
    icon = 'ri:train-line'                       # Iconify 图标名
    color = '#8cb1b3'                            # 图标颜色

  # --- 归档 / 标签页 ECharts 图表 ---
  [params.charts]
    archivesStartMonth = '2024-11'   # 归档图起始月份
    tagsChartLength = 10             # 标签图显示 Top N

  # --- 文章页底部赞助按钮 ---
  [params.sponsor]
    enable = true                               # 是否显示文章页赞助按钮
    title = '我很可爱，请给我钱！'              # 赞助区标题
    description = '我很可爱哦，可以给我点钱钱嘛~'  # 赞助区描述
    [[params.sponsor.methods]]
      name = '支付宝'                           # 赞助方式名称
      url = '/img/zhifubao.png'                      # 赞助二维码/链接图片路径
      color = '#00A3EE'                         # 该方式主题色
    [[params.sponsor.methods]]
      name = '微信支付'                           # 赞助方式名称
      url = '/img/weixin.png'                       # 赞助二维码/链接图片路径
      color = '#2DC100'                           # 该方式主题色

  # --- 文章版权声明（CC 协议）---
  [params.license]
    enable = true          # 是否启用文章页版权声明
    type = 'by-nc-sa'      # CC 类型：by / by-nc / by-nc-sa / zero 等
    language = 'zh'        # 版权声明语言
    
  # --- 动态手写签名（signature-inline）---
  # postCopyrightEnable：文章底部版权声明处的签名动画
  # footerEnable：全站页脚 copyright 区「by xxx」处的签名动画（关闭后显示 author.name 文字）
  # 不影响正文 Markdown 中 [签名](signature:) 的签名效果
  [params.signature]
    postCopyrightEnable = false  # 是否在文章版权声明处显示手写签名动画
    footerEnable = false         # 是否在页脚版权区显示手写签名动画

  # --- 文章页脚导航 ---
  [params.postFooter]
    navigationMerge = true # 合并上一篇/下一篇导航样式

  # --- 评论系统（文章 / 友链 / 留言页共用）---
  # provider 可选：waline | twikoo
  # 单篇文章可在 front matter 写 comment: false 关闭评论区
  [params.comment]
    provider = 'twikoo'    # 评论系统提供商：waline 或 twikoo

  # --- Waline 评论（https://waline.js.org/）---
  # 仅当 params.comment.provider = waline 时生效；当前使用 twikoo，此处留作切换备用
  [params.waline]
    serverURL = 'https://your-waline-url'   # 切换到 waline 时填写服务端地址（末尾不要加 /）
    placeholder = '分享你的想法...'          # 评论框占位文字

  # --- Twikoo 评论（仅当 params.comment.provider = twikoo 时生效）---
  # 留空 envId 时评论区显示配置提示，不影响站点其它功能
  # visitorEnable：文章访问量统计（需 provider=twikoo 且已配置 envId）
  # COMMENT_PLACEHOLDER 请在 Twikoo 管理后台「配置」中设置
  [params.twikoo]
    envId = 'https://your-twikoo-url'   # Twikoo 服务端环境 ID 或地址
    visitorEnable = true   # 开启文章访问数量统计，基于twikoo

  # --- 留言页信封动画图片（文件在 static/envelope/）---
  [params.envelope]
    before = '/envelope/before.png'  # 信封闭合状态图片
    after = '/envelope/after.png'    # 信封展开后背景图片
    cover = '/envelope/cover.png'    # 信封封面图片
    line = '/envelope/line.png'      # 信封装饰线图片
    wrapHeight = 447                 # 信封闭合状态高度（像素）
    openHeight = 1050                # 信封展开状态高度（像素）
    openOffset = -200                # 信封展开时垂直偏移（像素）
    danmakuOpenBottomTrim = 140      # 信封展开时弹幕区域底部向上缩短（像素）

  # --- 顶栏标题 ---
  [params.navbar]
    titleParts = ['克喵', 'Moretti']   # 顶栏主标题分段（可产生动画效果）
    subTitle = '<K.M/>'          # 顶栏副标题
    offset = 0                         # 顶栏初始垂直偏移（像素）

    # 移动端下滑隐藏顶栏（默认首页不生效，设 includeHome = true 则全站含首页生效）
    [params.navbar.mobileCollapse]
      enable = true                    # 是否在移动端启用下滑隐藏顶栏
      includeHome = false              # 是否包括主页
      scrollThreshold = 5              # 滚动超过该距离后才允许隐藏（px）
      scrollDelta = 10                 # 单次滑动超过该值触发隐藏/恢复（px）
      revealMode = 'scrollUp'          # 隐藏后如何恢复：top = 回到顶部才显示 | scrollUp = 上划即显示

    # 电脑端下滑隐藏顶栏（min-width: 769px；默认关闭）
    [params.navbar.desktopCollapse]
      enable = true                    # 是否在电脑端启用下滑隐藏顶栏
      includeHome = false              # 是否包括主页
      scrollThreshold = 5              # 滚动超过该距离后才允许隐藏（px）
      scrollDelta = 5                  # 单次滑动超过该值触发隐藏/恢复（px）
      revealMode = 'scrollUp'          # 隐藏后如何恢复：top = 回到顶部才显示 | scrollUp = 上划即显示

    # 顶栏随页面滚出视口（与自动隐藏互斥：对应端开启 collapse 时无效）
    [params.navbar.scrollWithPage]
      enable = false                   # true = 内页顶栏随页面滚出视口；false = 全站 fixed 顶栏
      includeHome = false              # false = 首页保持 fixed + Hero 全屏；true = 首页也随页滚动（透明顶栏叠层）

  # --- 全文搜索（Fuse.js）---
  [params.search]
    enable = true          # 是否启用全文搜索
    threshold = 0.35       # 匹配灵敏度（越小越严格）

  # --- 顶栏 / 侧栏导航菜单 ---
  # weight 越小越靠前；带 items 的项会展开子菜单
  [[params.menu.main]]
    name = '首页'                      # 菜单显示名称
    url = '/'                          # 菜单链接
    icon = 'ant-design:home-filled'    # 菜单图标（Iconify 名称）
    weight = 1                         # 排序权重，越小越靠前
  [[params.menu.main]]
    name = '文章'                      # 菜单显示名称
    url = '/categories/'               # 菜单链接
    icon = 'ant-design:read-filled'    # 菜单图标（Iconify 名称）
    navGroup = 'posts'                 # 导航分组标识，用于高亮/折叠
    weight = 2                         # 排序权重，越小越靠前
    [[params.menu.main.items]]
      name = '分类'                        # 子菜单显示名称
      url = '/categories/'                 # 子菜单链接
      icon = 'ant-design:appstore-filled'  # 子菜单图标
    [[params.menu.main.items]]
      name = '归档'                        # 子菜单显示名称
      url = '/archives/'                   # 子菜单链接
      icon = 'ant-design:container-filled' # 子菜单图标
    [[params.menu.main.items]]
      name = '标签'                        # 子菜单显示名称
      url = '/tags/'                       # 子菜单链接
      icon = 'ant-design:tags-filled'      # 子菜单图标
  [[params.menu.main]]
    name = '个人'                      # 菜单显示名称
    url = '/moments/'                  # 菜单链接
    icon = 'ant-design:user-outlined'  # 菜单图标（Iconify 名称）
    navGroup = 'personal'              # 导航分组标识，用于高亮/折叠
    weight = 3                         # 排序权重，越小越靠前
    [[params.menu.main.items]]
      name = '相册'                        # 子菜单显示名称
      url = '/gallery/'                    # 子菜单链接
      icon = 'ant-design:picture-filled'   # 子菜单图标
    [[params.menu.main.items]]
      name = '动态'                        # 子菜单显示名称
      url = '/moments/'                    # 子菜单链接
      icon = 'ant-design:compass-filled'   # 子菜单图标
    [[params.menu.main.items]]
      name = '追番'                        # 子菜单显示名称
      url = '/bangumi/'                    # 子菜单链接
      icon = 'mdi:television-play'         # 子菜单图标
  [[params.menu.main]]
    name = '留言'                      # 菜单显示名称
    url = '/comment/'                  # 菜单链接
    icon = 'ant-design:message-filled' # 菜单图标（Iconify 名称）
    weight = 4                         # 排序权重，越小越靠前
  [[params.menu.main]]
    name = '友链'                      # 菜单显示名称
    url = '/links/'                    # 菜单链接
    icon = 'ant-design:global-outlined' # 菜单图标（Iconify 名称）
    weight = 5                         # 排序权重，越小越靠前
  [[params.menu.main]]
    name = '关于'                      # 菜单显示名称
    url = '/about/'                    # 菜单链接
    icon = 'ant-design:idcard-filled'  # 菜单图标（Iconify 名称）
    weight = 6                         # 排序权重，越小越靠前

# --- 音乐播放器（APlayer + Meting.js）---
  # enable：是否显示播放器；单页可在 front matter 写 musicPlayer: false 关闭
  [params.music]
    enable = true                                 # 是否启用音乐播放器
    position = 'right'                            # 悬浮按钮位置：left 左下 | right 右下
    
    # apis：按顺序尝试，前一个不可用时自动切换下一个，默认不需要动
    apis = [  # Meting API 地址列表，用于解析网易云等歌单信息
      'https://api.i-meto.com/meting/api?server=:server&type=:type&id=:id&r=:r',
      'https://api.injahow.cn/meting/?server=:server&type=:type&id=:id',
      'https://meting.qjqq.cn/?server=:server&type=:type&id=:id',
      'https://meting.081531.xyz/api?server=:server&type=:type&id=:id&r=:r',
    ]
    server = 'netease'                            # 音乐平台：netease | tencent | kugou 等
    type = 'playlist'                             # 播放类型：playlist | song | album | artist
    id = '2580064383'                             # 网易云歌单/歌曲 ID

  # --- Live2D 看板娘（左下角 Live2D 角色）---
  # enable：是否启用；单页可在 front matter 写 live2d: false 关闭
  [params.live2d]
    enable = true                                 # 是否启用 Live2D 看板娘
    minWidth = 768                                # 低于此宽度不加载
    drag = false                                  # 是否允许拖拽看板娘
    tools = ['hitokoto', 'asteroids', 'switch-model', 'switch-texture', 'photo', 'info', 'quit']  # 工具栏按钮列表

    # 看板娘运行时（脚本 / 样式 / 提示语，一般保持默认即可）
    widget = 'https://live2d.kafuchino.top/'      # 看板娘 Widget 基础 URL
    waifuTips = 'jsdelivr/sequential/waifu-tips.js'  # 提示语脚本路径
    waifuCss = 'css/left.css'                     # 看板娘样式路径
    waifuTipsJson = 'waifu-tips.json'             # 提示语文件路径

    # 模型库 cdnPath（静态模型目录，含 model_list.json）— 与 apiPath 二选一
    cdnPath = 'https://live2d.kafuchino.top/'     # nova1751 扩展库：少女前线等（21 组模型）
    # 备用模型库（取消注释一行替换上方 cdnPath 即可切换模型种类）：
    # cdnPath = 'https://fastly.jsdelivr.net/gh/fghrsh/live2d_api/'   # fghrsh 经典库：Shizuku / 海王星 / Pio 等（7 组）
    # cdnPath = 'https://cdn.jsdelivr.net/gh/fghrsh/live2d_api/'      # 同上 · jsDelivr 国内节点
    # cdnPath = 'https://fastly.jsdelivr.net/gh/nova1751/live2d-api/' # nova1751 仓库镜像（模型集与 kafuchino 相同）
    #
    # 模型库 apiPath（fghrsh 动态 PHP 接口；启用时需注释掉上方 cdnPath）：
    # apiPath = 'https://live2d.fghrsh.net/api/'                      # fghrsh 官方动态 API（接口式换模型/皮肤）

  # --- 团团猫动态鼠标指针 ---
  # enable：是否启用；单页可在 front matter 写 mouse: false 关闭
  [params.mouse]
    enable = true                                # 是否启用自定义动态鼠标指针
    path = '/mouse/tuantuanma/'                  # 预压缩 WebP + manifest.json 目录（见 static/mouse/tuantuanma/）
    scale = 0.25                                 # manifest 内记录的缩放；重新压缩时改 compress-mouse 脚本参数

  # --- 全站背景特效（yzhanWeather · MIT，本地静态资源）---
  # enable：是否启用；单页可在 front matter 写 effects: false 关闭
  # type：sakura | rain | snow | firefly | butterfly | random（每次打开随机一种）
  # mobile：触摸设备或宽度 ≤768px 是否启用（默认 false）
  # randomize：打散雨/樱花/雪/蝴蝶轨迹；萤火虫不受此项影响，始终仅向上飘
  [params.effects]
    enable = true                                   # 是否启用全站背景特效
    type = 'firefly'                                # 特效类型（sakura / rain / snow / firefly / butterfly / random）
    randomTypes = ['sakura', 'rain', 'snow', 'firefly', 'butterfly']  # type = 'random' 时的候选特效
    randomize = true                                # 打散位置/速度/轨迹，避免过于规律
    mobile = false                                  # 移动端是否启用（默认关闭）
    maxDuration = 10                                # 动画基准周期（秒），越大越慢
    zIndex = 5                                      # 层级，需低于弹窗/导航
    script = '/vendor/yzhanweather/yzhanweather.min.js'  # 特效脚本路径

  # --- 站内无刷新跳转（PJAX）---
  [params.pjax]
    enable = true                                   # 是否启用站内无刷新跳转
    fadeDuration = 200                              # 内容区淡入淡出时长（毫秒）
    mountDelay = 120                                # 页内跳转：CSS/JS 就绪后额外等待（毫秒），减少布局突变

  # --- 外链安全中转（仅处理 Markdown 正文中的站外 HTTP/HTTPS 链接）---
  [params.safego]
    enable = true                                   # 是否启用外链中转
    base64Encode = true                             # 是否使用 URL-safe Base64 编码目标地址
    targetBlank = true                              # 是否在新窗口打开中转页
    path = '/go/'                                   # 中转页路径
    param = 'u'                                     # 目标地址查询参数名
    returnParam = 'from'                            # 来源页面查询参数名
    countdown = 5                                   # 自动跳转倒计时（秒）；小于 0 时仅手动跳转
    darkmode = 'auto'                               # auto：跟随系统；也可设为 true / false
    domainWhitelist = []                            # 额外放行的域名（不含协议）
    leaveText = '你即将访问站外链接，请确认目标地址后继续。'
    countdownText = '将在 {seconds} 秒后自动跳转'
    manualConfirmText = '请确认目标地址安全后，再点击立即跳转。'
